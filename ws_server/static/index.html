<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сигналы шорт</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Сигналы на шорт</div>
    <nav class="tabs">
      <button type="button" class="tab active" data-tab="signals">Сигналы</button>
      <button type="button" class="tab" data-tab="stats">Статистика</button>
    </nav>
    <div id="link-state" class="link-state">подключение…</div>
  </header>
  <p id="demo-banner" class="banner" hidden>
    Redis недоступен. На экране пример карточки, это не живой рынок и не рекомендация входа.
  </p>

  <section id="view-signals" class="workspace">
    <div id="columns" class="columns"></div>
    <aside id="detail" class="detail">
      <p class="empty">Выберите сигнал слева.</p>
    </aside>
  </section>

  <section id="view-stats" class="stats" hidden>
    <div id="gauges" class="gauges"></div>
    <div id="equity" class="equity"></div>
    <div class="table-wrap">
      <table id="signal-table">
        <thead>
          <tr>
            <th data-sort="symbol">Тикер</th>
            <th data-sort="outcome">Исход</th>
            <th data-sort="pnl_pct">P&amp;L %</th>
            <th data-sort="rating">Рейтинг</th>
            <th data-sort="created_at">Время</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="/static/vendor/lightweight-charts.js"></script>
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
